name: Bug report
description: Report incorrect discovery, hashing, or verification behavior.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets or private configuration. Use GitHub private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: AgentFreeze version
      placeholder: "agentfreeze 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal redacted reproduction
      description: Include commands, fixture shape, expected result, and observed result.
    validations:
      required: true
