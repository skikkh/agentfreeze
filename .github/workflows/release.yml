name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt
      - name: Bind release tags to the package version and current main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo +1.85.0 metadata --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "agentfreeze") | .version'
          )"
          expected_tag="v${package_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "release tag ${GITHUB_REF_NAME} does not match Cargo version ${package_version}" >&2
            exit 2
          fi
          main_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ -z "${main_sha}" ] || [ "${GITHUB_SHA}" != "${main_sha}" ]; then
            echo "release commit ${GITHUB_SHA} is not the current main commit ${main_sha:-missing}" >&2
            exit 2
          fi
      - name: Format
        run: cargo +1.85.0 fmt --all -- --check
      - name: Lint
        run: cargo +1.85.0 clippy --all-targets -- -D warnings
      - name: Test
        run: cargo +1.85.0 test --all-targets --locked
      - name: Audit dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.asset }}
    needs: preflight
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: linux-amd64
            executable: agentfreeze
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: darwin-arm64
            executable: agentfreeze
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: darwin-amd64
            executable: agentfreeze
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: windows-amd64
            executable: agentfreeze.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup target add "${{ matrix.target }}" --toolchain 1.85.0
      - name: Test
        shell: bash
        run: cargo +1.85.0 test --locked
      - name: Build
        shell: bash
        run: cargo +1.85.0 build --release --locked --target "${{ matrix.target }}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" dist/package/agentfreeze
          cp LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/agentfreeze-${{ matrix.asset }}.tar.gz" .
          rm -rf dist/package
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/package | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" dist/package/
          Copy-Item LICENSE,README.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/agentfreeze-${{ matrix.asset }}.zip"
          Remove-Item -Recurse -Force dist/package
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentfreeze-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Add installer and checksums
        run: |
          cp install.sh dist/install.sh
          cd dist
          sha256sum agentfreeze-* install.sh > SHA256SUMS
      - name: Attest checksums and installer
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/SHA256SUMS
            dist/install.sh
      - name: Prepare recoverable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if draft_state="$(
            gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null
          )"; then
            if [ "${draft_state}" != "true" ]; then
              echo "release ${GITHUB_REF_NAME} already exists and is not a draft" >&2
              exit 2
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "AgentFreeze ${GITHUB_REF_NAME}"
          fi
      - name: Upload or replace draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
